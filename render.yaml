services:
  - type: web
    name: ai-eval-framework
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-eval-framework-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-eval-framework-redis
          property: connectionString

  - type: worker
    name: ai-eval-framework-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.core.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-eval-framework-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-eval-framework-redis
          property: connectionString

  - type: redis
    name: ai-eval-framework-redis
    plan: free
    ipAllowList: []

databases:
  - name: ai-eval-framework-db
    plan: free