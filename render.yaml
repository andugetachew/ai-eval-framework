services:
  - type: web
    name: ai-eval-framework
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-eval-framework-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

  - type: worker
    name: ai-eval-framework-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.core.celery_app worker --loglevel=info -Q ai_eval_framework_queue
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-eval-framework-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: ai-eval-framework-db
    plan: free